name: Generate WinUtil screenshots

on:
  push:

permissions:
  contents: read

concurrency:
  group: winutil-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: windows-latest
    timeout-minutes: 15
    # WinUtil otherwise inherits the hosted runner's small 1024x768 desktop.
    env:
      WINUTIL_CAPTURE_WIDTH: "1920"
      WINUTIL_CAPTURE_HEIGHT: "1080"

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.12.0"
          python-version: "3.13"
          enable-cache: false

      - name: Set display resolution
        run: |
          # Set-DisplayResolution is provided by Windows PowerShell's ServerCore
          # module, so this step intentionally calls powershell.exe from pwsh.
          & powershell.exe -NoLogo -NoProfile -Command @'
          Set-DisplayResolution `
              -Width $env:WINUTIL_CAPTURE_WIDTH `
              -Height $env:WINUTIL_CAPTURE_HEIGHT `
              -Force
          '@

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to set the runner display resolution."
          }

          Add-Type @"
          using System.Runtime.InteropServices;

          public static class ResolutionCheck {
              [DllImport("user32.dll")]
              public static extern int GetSystemMetrics(int index);
          }
          "@

          $actualWidth = [ResolutionCheck]::GetSystemMetrics(0)
          $actualHeight = [ResolutionCheck]::GetSystemMetrics(1)
          if (
              $actualWidth -ne [int]$env:WINUTIL_CAPTURE_WIDTH -or
              $actualHeight -ne [int]$env:WINUTIL_CAPTURE_HEIGHT
          ) {
              throw (
                  "The hosted runner rejected the requested resolution. " +
                  "Requested: $env:WINUTIL_CAPTURE_WIDTH" +
                  "x$env:WINUTIL_CAPTURE_HEIGHT; " +
                  "actual: ${actualWidth}x${actualHeight}."
              )
          }

      - name: Report display environment
        run: |
          Add-Type @"
          using System.Runtime.InteropServices;

          public static class DisplayInfo {
              [DllImport("user32.dll")]
              public static extern int GetSystemMetrics(int index);
          }
          "@

          $width = [DisplayInfo]::GetSystemMetrics(0)
          $height = [DisplayInfo]::GetSystemMetrics(1)
          $sessionId = [Diagnostics.Process]::GetCurrentProcess().SessionId

          Write-Host "Resolution: ${width}x${height}"
          Write-Host "Session ID: $sessionId"
          Write-Host "User: $env:USERNAME"

      - name: Launch WinUtil
        run: |
          $command = 'irm https://christitus.com/win | iex'
          $bytes = [Text.Encoding]::Unicode.GetBytes($command)
          $encodedCommand = [Convert]::ToBase64String($bytes)

          # Hide the console host while leaving the WPF window available.
          $process = Start-Process powershell.exe -ArgumentList @(
              "-NoLogo",
              "-NoProfile",
              "-ExecutionPolicy", "Bypass",
              "-EncodedCommand", $encodedCommand
          ) -WindowStyle Hidden -PassThru

          "WINUTIL_HOST_PID=$($process.Id)" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

          $deadline = (Get-Date).AddSeconds(90)
          do {
              Start-Sleep -Seconds 2
              # Requiring a version after the title excludes the Cascadia console
              # host, whose title can be the unversioned string "WinUtil".
              $window = Get-Process |
                  Where-Object { $_.MainWindowTitle -match '^WinUtil\s+\d' } |
                  Select-Object -First 1
          } until ($window -or (Get-Date) -ge $deadline)

          if (-not $window) {
              throw "WinUtil did not expose a window within 90 seconds."
          }

          Write-Host "WinUtil HWND: $($window.MainWindowHandle)"
          Write-Host "WinUtil title: $($window.MainWindowTitle)"

          # Passing the exact HWND avoids desktop-enumeration ambiguity on the
          # hosted runner. Python validates its title and WPF class again.
          "WINUTIL_HWND=$($window.MainWindowHandle)" |
              Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate screenshots
        run: |
          & uv run `
              --python 3.13 `
              --with pywinauto `
              --with pillow `
              python automate_winutil.py 2>&1 |
              Tee-Object -FilePath capture.log

          if ($LASTEXITCODE -ne 0) {
              throw "Screenshot automation exited with code $LASTEXITCODE."
          }

      - name: Inspect UIA on failure
        if: failure()
        continue-on-error: true
        run: |
          uv run `
              --python 3.13 `
              --with pywinauto `
              --with pillow `
              python inspect_winutil.py

      - name: Upload screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: winutil-screenshots-${{ github.run_number }}
          path: |
            winutil-dark.png
            winutil-dark-framed.png
            winutil-light.png
            winutil-light-framed.png
            winutil-light-dark-comparison.png
            capture.log
            inspect_output.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Close WinUtil
        if: always()
        run: |
          if ($env:WINUTIL_HOST_PID) {
              Stop-Process `
                  -Id ([int]$env:WINUTIL_HOST_PID) `
                  -Force `
                  -ErrorAction SilentlyContinue
          }
